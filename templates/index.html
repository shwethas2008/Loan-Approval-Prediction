<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Approval Prediction</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">

    <h1>Loan Approval Prediction</h1>
    <p>Decision Tree Machine Learning Model</p>

    <form action="/submit" method="post">

        <label>Annual Income (INR)</label>
        <input type="number" name="annual_income" min="0" required>

        <label>Credit Score</label>
        <input type="number" name="credit_score" min="300" max="900" required>

        <label>Loan Amount (INR)</label>
        <input type="number" name="loan_amount" min="1" required>

        <label>Employment Years</label>
        <input type="number" name="employment_years" min="0" required>

        <label>Existing Debt (INR)</label>
        <input type="number" name="existing_debt" min="0" required>

        <button type="submit">Predict Loan Status</button>

    </form>

    {% if prediction %}
    <div class="result {{ prediction | lower }}">
        Loan Status: {{ prediction }}
    </div>
    {% endif %}

    <p>Educational ML demo only</p>

</div>

</body>
</html>
